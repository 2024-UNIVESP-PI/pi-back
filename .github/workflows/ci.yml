name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: projetoIntegrador1.settings
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --verbosity=2

  deploy:
    name: Deploy to PythonAnywhere
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
      PYTHONANYWHERE_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
      PYTHONANYWHERE_HOST: ${{ secrets.PYTHONANYWHERE_HOST }}
      PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
      PYTHONANYWHERE_SSH_PRIVATE_KEY: ${{ secrets.PYTHONANYWHERE_SSH_PRIVATE_KEY }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PYTHONANYWHERE_API_TOKEN PYTHONANYWHERE_DOMAIN PYTHONANYWHERE_HOST PYTHONANYWHERE_USERNAME PYTHONANYWHERE_SSH_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pa-ssh"
          printf '%s\n' "$PYTHONANYWHERE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pa-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/pa-ssh/id_ed25519"
          case "$PYTHONANYWHERE_HOST" in
            www.pythonanywhere.com) ssh_host=ssh.pythonanywhere.com ;;
            eu.pythonanywhere.com) ssh_host=ssh.eu.pythonanywhere.com ;;
            *) echo "Unsupported PythonAnywhere API host: $PYTHONANYWHERE_HOST" >&2; exit 1 ;;
          esac
          ssh-keyscan -H "$ssh_host" > "$RUNNER_TEMP/pa-ssh/known_hosts" 2>/dev/null
          echo "PYTHONANYWHERE_SSH_HOST=$ssh_host" >> "$GITHUB_ENV"
          echo "PYTHONANYWHERE_SSH_KEY=$RUNNER_TEMP/pa-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "PYTHONANYWHERE_KNOWN_HOSTS=$RUNNER_TEMP/pa-ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Update application and run Django maintenance
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$PYTHONANYWHERE_SSH_KEY" \
            -o UserKnownHostsFile="$PYTHONANYWHERE_KNOWN_HOSTS" \
            -o StrictHostKeyChecking=yes \
            "$PYTHONANYWHERE_USERNAME@$PYTHONANYWHERE_SSH_HOST" \
            "set -e
             cd /home/$PYTHONANYWHERE_USERNAME/pi-back
             git pull --ff-only origin main
             source /home/$PYTHONANYWHERE_USERNAME/.virtualenvs/pi-back/bin/activate
             pip install -r requirements.txt
             python manage.py migrate --noinput
             python manage.py collectstatic --noinput"

      - name: Reload PythonAnywhere web app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Token $PYTHONANYWHERE_API_TOKEN" \
            "https://$PYTHONANYWHERE_HOST/api/v0/user/$PYTHONANYWHERE_USERNAME/webapps/$PYTHONANYWHERE_DOMAIN/reload/"
